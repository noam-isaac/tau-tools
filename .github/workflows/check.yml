name: Offline checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [review/static-data-artifacts]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: |
          python scripts/test-static.py
          python scripts/test-refresh.py
          python scripts/test-restore.py
          test -z "$(git ls-files data snapshot.json)"
  artifact:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore only the existing Vercel snapshot (no scrapers)
        run: python scripts/restore-snapshot.py
      - run: python scripts/build-static.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-datasets-${{ github.run_id }}
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
