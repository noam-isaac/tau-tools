name: Offline checks
on:
  pull_request:
  push:
    branches: [review/static-data-artifacts]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: |
          python scripts/test-static.py
          python scripts/test-refresh.py
          python scripts/test-restore.py
          test -z "$(git ls-files data snapshot.json)"
